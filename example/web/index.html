<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>music-lyric-player-skia</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <section id="panel">
      <div class="row wrap">
        <label>audio <input type="file" id="audio-file" accept="audio/*" /></label>
        <label>font <input type="file" id="font-file" accept=".ttf,.otf,.ttc" /></label>
        <label>lyric <input type="file" id="lyric-file" /></label>
        <button id="lyric-paste">paste hex…</button>
      </div>

      <div class="row">
        <button id="toggle" disabled>play</button>
        <input type="range" id="seek" min="0" max="0" step="0.001" value="0" disabled />
        <span id="time" class="muted">0:00 / 0:00</span>
      </div>

      <details id="config">
        <summary>config</summary>

        <div id="config-body">
          <div class="row wrap">
            <label>size <input type="range" id="config-size" min="12" max="96" step="1" value="34" /></label>
            <span id="config-size-value" class="muted">34px</span>

            <label>gap <input type="range" id="config-gap" min="0" max="64" step="1" value="16" /></label>
            <span id="config-gap-value" class="muted">16px</span>

            <label>
              align
              <select id="config-align">
                <option value="Left" selected>Left</option>
                <option value="Center">Center</option>
                <option value="Right">Right</option>
              </select>
            </label>
          </div>

          <textarea id="config-patch" spellcheck="false" placeholder='extra JSON patch, e.g. {"container": {"backgroundColor": "#101218"}}'></textarea>

          <div class="row">
            <button id="config-apply">apply</button>
            <span class="grow"></span>
          </div>
        </div>
      </details>

      <div id="notice"></div>
      <div id="telemetry" class="muted">loading…</div>
    </section>

    <dialog id="paste-dialog">
      <form method="dialog">
        <textarea id="paste-text" spellcheck="false" placeholder="hex-encoded parsed.Info protobuf"></textarea>
        <button value="load">load</button>
        <button value="cancel">cancel</button>
      </form>
    </dialog>

    <audio id="audio" hidden></audio>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
