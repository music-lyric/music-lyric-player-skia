name: Release Web

on:
  workflow_call:
    outputs:
      artifact:
        description: 'artifact name.'
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:

permissions:
  contents: read

# Skia, lyric and our own module must all link against one emsdk; a split there breaks the libc++ ABI they share.
env:
  EMSDK_VERSION: 4.0.7

jobs:
  build-third-party-skia:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Resolve Cache Key
        id: key
        shell: bash
        run: |
          hash=$( { git rev-parse HEAD:third-party/skia; cat cmake/third-party/skia/args/common.gn cmake/third-party/skia/args/web.gn; echo "$EMSDK_VERSION"; } | sha256sum | cut -c1-16)
          echo "value=skia-v1-web-wasm32-release-$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Skia
        id: cache
        uses: actions/cache@v4
        with:
          path: out/third-party/skia
          key: ${{ steps.key.outputs.value }}

      - name: Init Skia
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --depth 1 third-party/skia

      - name: Setup Emsdk
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build Skia
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cmake -DSKIA_BUILD_PLATFORM=web -P cmake/third-party/skia/build.cmake

  build-third-party-lyric:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Resolve Cache Key
        id: key
        shell: bash
        run: |
          hash=$( { git rev-parse HEAD:third-party/lyric; echo "$EMSDK_VERSION"; } | sha256sum | cut -c1-16)
          echo "value=lyric-v1-web-wasm32-release-$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Lyric
        id: cache
        uses: actions/cache@v4
        with:
          path: out/third-party/lyric
          key: ${{ steps.key.outputs.value }}

      - name: Init Lyric
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --recursive --depth 1 third-party/lyric

      - name: Setup Emsdk
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build Lyric
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cmake -DLYRIC_BUILD_PLATFORM=web -P cmake/third-party/lyric/build.cmake

  build:
    needs: [build-third-party-skia, build-third-party-lyric]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore Skia
        uses: actions/cache/restore@v4
        with:
          path: out/third-party/skia
          key: ${{ needs.build-third-party-skia.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore Lyric
        uses: actions/cache/restore@v4
        with:
          path: out/third-party/lyric
          key: ${{ needs.build-third-party-lyric.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Setup Emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Verify Glaze
        shell: bash
        run: cmake -P cmake/third-party/glaze/build.cmake

      - name: Package
        shell: bash
        run: cmake -P cmake/package/web.cmake

      - name: Resolve Artifact Name
        id: meta
        shell: bash
        run: echo "name=web-wasm32-release" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: out/app/dist/web-wasm32-release.zip
          if-no-files-found: error
