name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/release-windows.yml

  web:
    uses: ./.github/workflows/release-web.yml

  release:
    needs: [windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List Assets
        shell: bash
        run: ls -R dist

      - name: Build Notes
        shell: bash
        run: python3 script/change-log/build.py --current

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          body_path: CURRENT_CHANGELOG.md
          prerelease: false
          fail_on_unmatched_files: true

  publish-npm:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: web-wasm32-release
          path: out/app/dist

      - name: Restore Package
        shell: bash
        run: |
          unzip -q out/app/dist/web-wasm32-release.zip -d out/app/dist
          rm -rf platform/web/dist
          mv out/app/dist/web-wasm32-release/dist platform/web/dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./platform/web/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Publish Package
        shell: bash
        run: |
          cd platform/web
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
